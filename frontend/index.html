<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Login - Chatbot IFISC</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="login-container">
        <h2>Acesso ao Chatbot</h2>
        <form id="login-form">
            <input type="text" id="username" placeholder="Usuário" required><br>
            <input type="password" id="password" placeholder="Senha" required><br>
            <button type="submit">Entrar</button>
        </form>
        <p id="error-msg" style="color: red;"></p>
    </div>

    <script>
        const API_BASE = 'http://localhost:8000';  // igual ao chat.js

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const formData = new URLSearchParams();
            formData.append('username', username);
            formData.append('password', password);

            try {
                const res = await fetch(`${API_BASE}/token`, {
                    method: 'POST',
                    body: formData
                });
                if (res.ok) {
                    const data = await res.json();
                    localStorage.setItem('token', data.access_token);
                    window.location.href = '/chat.html';
                } else {
                    document.getElementById('error-msg').innerText = 'Usuário ou senha inválidos.';
                }
            } catch (err) {
                document.getElementById('error-msg').innerText = 'Erro de conexão.';
            }
        });
    </script>
</body>
</html>
