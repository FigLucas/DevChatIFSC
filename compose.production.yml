services:
  chatbot:
    build:
      context: ./backend
      target: production
    expose:
      - "8000"
    env_file:
      - .env
    environment:
      APP_ENV: production
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?configure ALLOWED_HOSTS}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?configure ALLOWED_ORIGINS}
      AUTH_USERS_FILE: /run/secrets/auth_users
      RAG_WEB_SEARCH_MODE: ${RAG_WEB_SEARCH_MODE:-fallback}
    secrets:
      - auth_users
    volumes:
      - ./backend/data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: production
    ports:
      - "8080:8080"
    depends_on:
      chatbot:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /var/cache/nginx:size=16m,mode=0755
      - /var/run:size=1m,mode=0755
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging:
      options:
        max-size: "10m"
        max-file: "3"

secrets:
  auth_users:
    file: ${AUTH_USERS_FILE_PATH:-./secrets/users.json}
